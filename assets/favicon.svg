<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a0848"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="15%"  stop-color="#f0e0ff"/>
      <stop offset="35%"  stop-color="#d8a8ff"/>
      <stop offset="55%"  stop-color="#9840ee"/>
      <stop offset="75%"  stop-color="#5818be"/>
      <stop offset="100%" stop-color="#160040"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg-grad)"/>
  <!-- Magenta ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ff2fd0" stroke-width="1.5" opacity="0.8"/>
  <!-- BR text group, clipped to circle, rotated -10° around centre -->
  <g clip-path="url(#circle-clip)" transform="rotate(-10, 32, 32)">
    <!-- 5 extrusion layers -->
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="34" y="44" fill="#160040">BR</text>
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="33.5" y="43.5" fill="#260064">BR</text>
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="33" y="43" fill="#360088">BR</text>
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="32.5" y="42.5" fill="#4e10ba">BR</text>
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="32" y="42" fill="#5e20d0">BR</text>
    <!-- Chrome face -->
    <text text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="34" font-weight="700" x="32" y="41" fill="url(#chrome)">BR</text>
  </g>
</svg>
