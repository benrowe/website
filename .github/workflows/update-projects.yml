name: Update Projects Data

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch top 3 recently-updated repos
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_PAT }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/repos?sort=updated&visibility=all&per_page=3" \
          > /tmp/repos.json

          if ! jq -e 'type == "array"' /tmp/repos.json > /dev/null 2>&1; then
            echo "::error::GitHub API did not return a repo list — check that the GH_PROJECTS_PAT secret is set and valid."
            echo "API response was:"
            cat /tmp/repos.json
            exit 1
          fi

          jq '.[:3] | map({name, description, html_url, private})' /tmp/repos.json > _data/projects.json

      - name: Show generated file
        run: cat _data/projects.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/projects.json
          if git diff --cached --quiet; then
            echo "No changes to _data/projects.json — skipping commit."
            exit 0
          fi
          git commit -m "chore: update projects data [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
