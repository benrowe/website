<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.username }} - {{ site.user_title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ '/assets/img/site-title.webp' | absolute_url }}">
  <meta property="og:image:width" content="1209">
  <meta property="og:image:height" content="554">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ site.username }} - {{ site.user_title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ '/assets/img/site-title.webp' | absolute_url }}">

  <link rel="icon" type="image/svg+xml" href="{{ "/assets/favicon.svg" | prepend: site.baseurl }}">

  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}">
</head>
